name: Tests et version Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run presentmon
      - name: Tests Rust (sur un vrai Windows)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Analyse du PC de GitHub passée dans l'évaluation
        run: node scripts/verifier-analyse.mjs src-tauri/target/analyse.json

  version:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run presentmon
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: FPS Cagoule ${{ github.ref_name }}
          releaseBody: Télécharge le fichier « FPS Cagoule_…_x64-setup.exe » ci-dessous. Les versions suivantes s'installent toutes seules.
          releaseDraft: false
          prerelease: false
