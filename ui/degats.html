<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Dégâts de la manche</title>
  <style>
    :root { --texte: #e9ecf2; --discret: #8b92a5; --accent: #6f9dff; --rouge: #ff7a8a; --vide: #2a2f3d; }
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
    body { font: 13px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--texte); }
    .carte {
      margin: 6px; padding: 12px 16px 12px; border-radius: 16px; height: 446px; box-sizing: border-box;
      background: rgba(14, 16, 22, .88); border: 1px solid rgba(255, 255, 255, .07);
      opacity: 0; transform: translateX(-14px); transition: opacity .35s ease, transform .35s ease;
    }
    .carte.visible { opacity: 1; transform: none; }
    .carte.sortie { opacity: 0; transform: translateX(-14px); transition-duration: .6s; }
    .haut { display: flex; align-items: center; justify-content: space-between; color: var(--discret); font-size: 12px; }
    .manche { display: flex; align-items: center; gap: 4px; }
    .manche button {
      width: 20px; height: 20px; padding: 0; border: 0; border-radius: 6px; cursor: pointer;
      background: rgba(255, 255, 255, .07); color: var(--texte); font: 700 14px/18px inherit; font-family: inherit;
    }
    .manche button:disabled { opacity: .25; cursor: default; }
    .onglets { display: flex; gap: 4px; }
    .onglets button {
      width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
      background: rgba(255, 255, 255, .07); color: var(--discret); font: 700 11px/22px inherit; font-family: inherit;
    }
    .onglets button.actif { background: var(--accent); color: #0b0c10; }
    .page { display: none; animation: entree .3s ease; }
    .page.active { display: block; }
    @keyframes entree { from { opacity: 0; transform: translateY(4px); } }
    .titre { margin: 4px 0 8px; font-size: 11px; font-weight: 600; color: var(--discret); text-transform: uppercase; letter-spacing: .06em; }
    .moi { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 6px; }
    .moi b { font-size: 34px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
    .moi span { color: var(--discret); }
    .cibles { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .cibles span { padding: 1px 8px; border-radius: 999px; background: rgba(111, 157, 255, .14); font-size: 11.5px; }
    .cibles span i { font-style: normal; color: var(--accent); font-weight: 700; margin-left: 4px; }
    h2 { margin: 8px 0 3px; font-size: 11px; font-weight: 600; color: var(--discret); text-transform: uppercase; letter-spacing: .06em; display: flex; }
    h2 span { margin-left: auto; width: 44px; text-align: right; }
    .ligne { display: grid; grid-template-columns: 20px 132px 1fr 34px; align-items: center; gap: 7px; height: 25px; }
    .ligne.duo { grid-template-columns: 20px 1fr 44px 44px; }
    .nom { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .toi .nom { color: var(--accent); font-weight: 700; }
    .op { width: 20px; height: 20px; border-radius: 4px; display: block; }
    .op.lettres { display: grid; place-items: center; background: var(--vide); color: var(--discret); font-size: 9px; font-weight: 700; }
    .barre { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .06); overflow: hidden; }
    .barre div { height: 100%; width: 0; border-radius: 3px; background: #4c5670; transition: width .7s cubic-bezier(.2, .8, .2, 1); }
    .toi .barre div { background: var(--accent); }
    .adverse .barre div { background: rgba(255, 122, 138, .55); }
    .val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
    .recu { color: var(--rouge); }
    .zero { color: var(--discret); font-weight: 400; }
    .entetes { display: flex; justify-content: space-between; margin: 4px 0 2px; font-size: 11px; font-weight: 600; color: var(--discret); text-transform: uppercase; letter-spacing: .06em; }
    .duel { display: grid; grid-template-columns: 44px 68px 28px 1fr 68px 40px; align-items: center; gap: 7px; height: 54px; border-bottom: 1px solid rgba(255, 255, 255, .05); }
    .duel:last-child { border: 0; }
    .duel .op { width: 28px; height: 28px; }
    .chiffre { font-size: 20px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .chiffre small { display: block; margin-top: 3px; font-size: 9.5px; font-weight: 700; letter-spacing: .05em; color: var(--discret); }
    .sortant .chiffre { color: var(--accent); }
    .entrant { text-align: right; }
    .entrant .chiffre { color: var(--rouge); }
    .chiffre.zero { color: var(--discret); font-weight: 600; }
    .zones { display: flex; align-items: center; gap: 3px; }
    .zones svg { width: 16px; height: 30px; flex: none; }
    .zones span { font-size: 10px; line-height: 10px; color: var(--discret); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .zones span i { display: block; font-style: normal; }
    .zones span i.oui { color: var(--texte); }
    .zones span b { font-weight: 700; }
    .vide { margin-top: 30px; text-align: center; color: var(--discret); }
  </style>
</head>
<body>
  <div class="carte" id="carte"></div>
  <script src="degats.js"></script>
</body>
</html>
