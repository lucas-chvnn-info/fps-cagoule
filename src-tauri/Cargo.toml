[package]
name = "fps-cagoule"
version = "0.15.0"
description = "Analyse, optimisation et boost par jeu pour Windows 11"
authors = ["Lucas Chavanne"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_UI_ColorSystem",
  "Win32_Devices_Display",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_SystemInformation",
  "Win32_System_Power",
  "Win32_UI_Shell",
] }

# Binaire le plus petit possible : il tourne en permanence en arrière-plan
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
